<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
<div
  *ngIf="showSaveConfirmation"
  class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity duration-300"
  style="z-index: 50;"
>
  <div
    class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm animate-scaleIn"
  >
    <h2 class="text-lg font-semibold text-gray-800 mb-2 text-center">
      Error de inicio de sesión
    </h2>

    <p class="text-gray-600 text-center mb-6">
      Gmail o contraseña incorrectos
    </p>

    <button
      (click)="ok()"
      class="w-full py-2.5 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition-colors duration-200 active:scale-95"
    >
      Ok
    </button>
  </div>
</div>
  
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-blue-100">
    
    <!-- Logo - Mismo estilo que sidebar -->
    <div class="flex items-center justify-center gap-3 px-2 py-2 rounded-2xl mb-8 transition-all duration-200">
      <div class="size-12 bg-gradient-to-r from-blue-600 to-blue-800 rounded-xl flex items-center justify-center font-bold text-lg shadow-[0_4px_12px_rgba(59,130,246,0.25)]">
        <span class="text-white">F</span>
      </div>
      <span class="font-extrabold text-[20px] tracking-wide whitespace-nowrap text-gray-800">
        Fisiocenter
      </span>
    </div>

    <h2 class="text-xl font-semibold text-gray-600 text-center mb-6">Iniciar Sesión</h2>

    <form [formGroup]="form" (ngSubmit)="entrar()" class="space-y-6">
      
      <!-- Campo Gmail -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Correo Electrónico</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <img src="https://img.icons8.com/ios-glyphs/20/6b7280/email.png" alt="email" class="w-5 h-5">
          </div>
          <input
            type="email"
            formControlName="gmail"
            placeholder="usuario@gmail.com"
            class="w-full border border-gray-300 pl-10 pr-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          />
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <img src="https://img.icons8.com/ios-glyphs/20/6b7280/lock.png" alt="contraseña" class="w-5 h-5">
          </div>
          <input
            [type]="verPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="w-full border border-gray-300 pl-10 pr-12 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          />
          <button 
            type="button" 
            (click)="togglePassword()" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center hover:bg-gray-100 rounded-r-xl transition-colors"
          >
            <img 
              [src]="verPassword ? 'https://img.icons8.com/ios-glyphs/20/6b7280/hide.png' : 'https://img.icons8.com/ios-glyphs/20/6b7280/visible.png'" 
              [alt]="verPassword ? 'ocultar' : 'mostrar'" 
              class="w-5 h-5"
            >
          </button>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex space-x-4 pt-4">
        <button 
          type="submit" 
          class="flex-1 bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 rounded-xl font-semibold hover:from-blue-700 hover:to-blue-800 transition-all shadow-[0_4px_12px_rgba(59,130,246,0.25)] hover:shadow-[0_6px_20px_rgba(59,130,246,0.35)]"
        >
          Iniciar Sesión
        </button>
        <button 
          type="button" 
          (click)="crearCuenta()" 
          class="flex-1 border-2 border-blue-500 text-blue-600 py-3 rounded-xl font-semibold hover:bg-blue-50 transition-all"
        >
          Crear Cuenta
        </button>
      </div>
    </form>

    <!-- Footer -->
    <div class="mt-8 pt-6 border-t border-gray-200 text-center">
      <p class="text-sm text-gray-600">Sistema de Gestión de Fisioterapia</p>
    </div>
  </div>
</div>
