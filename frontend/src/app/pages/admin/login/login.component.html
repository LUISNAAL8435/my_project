<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Iniciar Sesión</h2>

    <form [formGroup]="form" (ngSubmit)="entrar()" class="space-y-4">
      <div>
        <label class="block mb-1 font-medium">Gmail</label>
        <input
          type="email"
          formControlName="gmail"
          placeholder="usuario@gmail.com"
          class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring focus:border-blue-500"
        />
      </div>

      <div>
        <label class="block mb-1 font-medium">Contraseña</label>
        <div class="relative">
          <input
            [type]="verPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="******"
            class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring focus:border-blue-500"
          />
          <button type="button" (click)="togglePassword()" class="absolute right-2 top-2 text-gray-500">
            {{ verPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="flex space-x-4 mt-4">
        <button type="submit" class="w-1/2 bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">
          Entrar
        </button>
        <button type="button" (click)="crearCuenta()" class="w-1/2 border border-blue-500 text-blue-500 py-2 rounded hover:bg-blue-100 transition">
          Crear cuenta
        </button>
      </div>
    </form>
  </div>
</div>
