<div class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-b from-indigo-50 to-white">
  <div class="w-full max-w-2xl bg-white shadow-xl rounded-xl p-6 md:p-10">

    <h1 class="text-3xl font-extrabold text-slate-800 mb-6">Crear cuenta</h1>

    <form [formGroup]="form" (ngSubmit)="enviar()" class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- Nombre -->
      <div>
        <label class="text-sm font-semibold text-slate-600">Nombre</label>
        <input type="text" formControlName="nombre"
               class="w-full mt-2 p-3 border rounded-lg"
               placeholder="Tu nombre">
        <small *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid"
               class="text-red-500 text-xs">Mínimo 2 caracteres.</small>
      </div>

      <!-- Apellidos -->
      <div>
        <label class="text-sm font-semibold text-slate-600">Apellidos</label>
        <input type="text" formControlName="apellidos"
               class="w-full mt-2 p-3 border rounded-lg"
               placeholder="Tus apellidos">
        <small *ngIf="form.get('apellidos')?.touched && form.get('apellidos')?.invalid"
               class="text-red-500 text-xs">Mínimo 2 caracteres.</small>
      </div>

      <!-- Gmail -->
      <div class="md:col-span-2">
        <label class="text-sm font-semibold text-slate-600">Correo Gmail</label>
        <input type="email" formControlName="gmail"
               class="w-full mt-2 p-3 border rounded-lg"
               placeholder="tunombre@gmail.com">
        <small *ngIf="form.get('gmail')?.touched && form.get('gmail')?.invalid"
               class="text-red-500 text-xs">
          Ingrese un Gmail válido
        </small>
      </div>

      <!-- Password -->
      <div class="relative md:col-span-2">
        <label class="text-sm font-semibold text-slate-600">Contraseña</label>

        <input [type]="verPassword ? 'text' : 'password'"
               formControlName="password"
               class="w-full mt-2 p-3 border rounded-lg pr-24"
               placeholder="Mínimo 6 caracteres">

        <button type="button"
                (click)="togglePassword()"
                class="absolute right-2 top-[55%] -translate-y-1/2 text-xs px-3 py-1 bg-gray-100 border rounded-lg">
          {{ verPassword ? 'Ocultar' : 'Mostrar' }}
        </button>

        <small *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
               class="text-red-500 text-xs">Mínimo 6 caracteres.</small>
      </div>

      <!-- Botones -->
      <div class="md:col-span-2 flex flex-col md:flex-row gap-3 mt-4">
        <button type="submit"
                class="w-full md:w-auto bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700">
          Crear cuenta
        </button>

        <button type="button"
                (click)="login()"
                class="w-full md:w-auto border px-6 py-3 rounded-lg bg-white hover:bg-gray-50">
          Login
        </button>
      </div>

    </form>

  </div>
</div>
