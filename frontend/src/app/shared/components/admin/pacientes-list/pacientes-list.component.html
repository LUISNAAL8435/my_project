
  <div class="agregar-paciente-container h-full">
  <!-- Header con botones pequeños -->
  <div class="bg-blue-50 px-6 py-4 border-b border-blue-200 sticky top-0 z-10">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
      <div class="mb-4 sm:mb-0 text-center sm:text-left">
        <h2 class="text-2xl font-bold text-blue-800 mb-1">
          PACIENTES REGISTRADOS
        </h2>
      </div>
      <div class="flex gap-2">
        <button 
          type="button"
          (click)="onCancelar()"
          class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 focus:ring-2 focus:ring-gray-300 transition-all font-bold text-sm"
        >
          Cancelar
        </button>
      </div>
    </div>
  </div>

<!-- Lista de Pacientes - Integrada directamente -->
  <div class="lista-pacientes-container h-full flex flex-col">
    <div class="flex-1 min-h-0 mb-12 max-h-[55vh] lg:max-h-[60vh]">
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm h-full overflow-auto">
            <div class="min-w-[600px]">
        <table class="w-full">
          <!-- Header de la tabla -->
          <thead class="sticky top-0 z-10 bg-blue-600 border-b border-blue-700">
            <tr>
              <th class="px-3 py-3 text-center text-sm font-medium text-white w-1/5">Nombre</th>
              <th class="px-3 py-3 text-center text-sm font-medium text-white w-1/5">Apellidos</th>
              <th class="px-3 py-3 text-center text-sm font-medium text-white w-1/5">Folio</th>
              <th class="px-3 py-3 text-center text-sm font-medium text-white w-1/5">Género</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 bg-white">
            <tr *ngFor="let paciente of pacientesFiltrados; let i = index" 
                class="hover:bg-gray-50 transition-colors">
              
              <!-- Nombre -->
              <td class="px-3 py-3 text-center align-middle w-1/5">
                <div class="font-medium text-gray-900 break-words mx-auto max-w-[120px] sm:max-w-none"
                    [title]="paciente.nombre">
                  <span class="text-xs sm:text-sm leading-tight">
                    {{paciente.nombre}}
                  </span>
                </div>
              </td>
              
              <!-- Apellidos -->
              <td class="px-3 py-3 text-center align-middle w-1/5">
                <div class="text-gray-900 break-words mx-auto max-w-[120px] sm:max-w-none"
                    [title]="paciente.apellidos">
                  <span class="text-xs sm:text-sm leading-tight">
                    {{paciente.apellidos}}
                  </span>
                </div>
              </td>
              
              <!-- Folio -->
              <td class="px-3 py-3 text-center align-middle w-1/6">
                <span class="font-mono text-xs sm:text-sm text-blue-600 bg-blue-50 px-2 py-1 rounded-full border border-blue-100 inline-block mx-auto whitespace-nowrap">
                  {{paciente.folio}}
                </span>
              </td>
              
              <!-- Género -->
              <td class="px-3 py-3 text-center align-middle w-1/6">
                <span class="inline-flex items-center gap-1 sm:gap-2 justify-center mx-auto" [class]="paciente.color">
                  <span class="material-icons text-xs sm:text-sm">
                    {{paciente.icono}}
                  </span>
                  <span class="capitalize text-xs sm:text-sm">
                    {{paciente.sexo === 'Femenino' ? 'F' : 'M'}}
                  </span>
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
  </div>
